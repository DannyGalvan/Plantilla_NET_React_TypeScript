name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Project.sln

      - name: Build (warnings as errors)
        run: dotnet build Project.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test Project.sln --no-build --configuration Release --logger "trx;LogFileName=backend.trx"

      - name: Vulnerability scan
        run: dotnet list Project.Server/Project.Server.csproj package --vulnerable --include-transitive

  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: project.client/pnpm-lock.yaml

      - name: Install
        working-directory: project.client
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: project.client
        run: pnpm typecheck

      - name: Lint
        working-directory: project.client
        run: pnpm lint

      - name: Build
        working-directory: project.client
        run: pnpm build

      - name: Test
        working-directory: project.client
        run: pnpm test

      - name: Vulnerability scan
        working-directory: project.client
        # Fails the job on high or critical advisories. Low/moderate still log
        # but do not break the build.
        run: pnpm audit --audit-level=high
