name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend build, unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Project.slnx

      - name: Build (warnings as errors)
        run: dotnet build Project.slnx --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/Project.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      - name: Architecture tests
        run: dotnet test tests/Project.ArchitectureTests --no-build -c Release --logger "trx;LogFileName=architecture.trx"

      - name: Migrations are up to date with the model
        run: |
          dotnet tool restore
          for provider in SqlServer PostgreSql MySql; do
            for module in Tenancy Identity Organization Catalog; do
              dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
                --project src/Migrations/Project.Migrations.$provider \
                --startup-project src/Migrations/Project.Migrations.$provider \
                --context ${module}DbContext
            done
          done

      - name: Vulnerable packages
        run: |
          dotnet list Project.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  functional:
    name: Functional and isolation tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, SqlServer, MySql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test against a real ${{ matrix.provider }} (Testcontainers)
        env:
          TEST_DB_PROVIDER: ${{ matrix.provider }}
        run: dotnet test tests/Project.Api.FunctionalTests -c Release --logger "trx;LogFileName=functional-${{ matrix.provider }}.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-results-${{ matrix.provider }}
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/project.client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/project.client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/project.client/.nvmrc
          cache: pnpm
          cache-dependency-path: src/project.client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format, design tokens and tests
        run: pnpm verify

      - name: Coverage
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Vulnerable packages
        run: pnpm audit --audit-level high

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the production-like stack
        working-directory: deploy/docker
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-$(openssl rand -hex 16)
          JWT_SIGNING_KEY=$(openssl rand -hex 32)
          ADMIN_PASSWORD=Ci.Admin-$(openssl rand -hex 6)
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && exit 0
            sleep 5
          done
          echo "The API did not become ready in time"
          exit 1

      - name: Smoke test
        working-directory: deploy/docker
        run: |
          set -e
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/api/v1/platform/config
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          password=$(grep ADMIN_PASSWORD .env | cut -d= -f2)
          curl -fsS -X POST http://localhost:8080/api/v1/identity/auth/login \
            -H 'content-type: application/json' -d "{\"userName\":\"admin\",\"password\":\"$password\"}" | grep -q accessToken

      - name: Logs on failure
        if: failure()
        working-directory: deploy/docker
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Stop
        if: always()
        working-directory: deploy/docker
        run: docker compose -f docker-compose.prod.yml down -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/project.client/.nvmrc
      - run: node scripts/check-docs.mjs
      - name: Scripts parse
        run: |
          bash -n scripts/*.sh
          pwsh -NoProfile -Command 'Get-ChildItem scripts/*.ps1 | ForEach-Object { $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors); if ($errors) { throw "$($_.Name): $errors" } }'
